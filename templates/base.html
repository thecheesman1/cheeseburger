<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeseburger Casino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}" class="logo">🍔<span>$</span> Cheeseburger</a>
        <div class="nav-links">
            {% if user %}
                <span class="balance">💰 ${{ '{:,.0f}'.format(user['balance']) }}</span>
                <a href="{{ url_for('leaderboard') }}">🏆 LB</a>
                <a href="{{ url_for('crates') }}">📦 Crates</a>
                <a href="{{ url_for('market') }}">🏪 Market</a>
                <a href="{{ url_for('inventory') }}">🎒 Inv</a>
                {% if user['username'] == 'esadsa' %}
                    <a href="{{ url_for('admin') }}" style="color:#ff6b6b;">⚙️ Admin</a>
                {% endif %}
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
